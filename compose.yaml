
services:
  postgres:
    image: postgres:16-alpine
    container_name: minibank-postgres

    ports:
      - "127.0.0.1:5436:5432"

    environment:
      POSTGRES_DB: minibank
      POSTGRES_USER: minibank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina a senha no arquivo .env}

    volumes:
      - minibank_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minibank -d minibank"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  minibank_postgres_data:
